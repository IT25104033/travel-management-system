<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice Management</title>
</head>

<body>

<h1>Invoice Management</h1>

<p>Admin Operations & Billing</p>


<!-- Add Invoice Form -->

<h2>Add New Invoice</h2>

<div
        th:if="${errorMessage}"
        style="color: red; margin-bottom: 15px;">

    <strong th:text="${errorMessage}"></strong>

</div>

<form action="/invoices/add" method="post">

    <label for="invoiceNumber">Invoice Number:</label>
    <input
            type="text"
            id="invoiceNumber"
            name="invoiceNumber"
            required>
    <br><br>


    <!-- Booking Selection -->

    <label for="bookingId">Booking:</label>

    <select
            id="bookingId"
            name="bookingId">

        <option value="">-- Select Booking --</option>

        <option
                th:each="booking : ${bookings}"
                th:value="${booking.id}"
                th:text="${'Booking #' + booking.id + ' - ' + booking.customerName + ' - ' + booking.totalAmount}">
        </option>

    </select>

    <br><br>


    <label for="customerName">Customer Name:</label>

    <input
            type="text"
            id="customerName"
            name="customerName"
            required>

    <br><br>


    <label for="invoiceDate">Invoice Date:</label>

    <input
            type="datetime-local"
            id="invoiceDate"
            name="invoiceDate"
            required>

    <br><br>


    <label for="totalAmount">Total Amount:</label>

    <input
            type="number"
            id="totalAmount"
            name="totalAmount"
            step="0.01"
            required>

    <br><br>


    <label for="invoiceStatus">Invoice Status:</label>

    <select
            id="invoiceStatus"
            name="invoiceStatus"
            required>

        <option value="UNPAID">UNPAID</option>
        <option value="PARTIAL">PARTIAL</option>
        <option value="PAID">PAID</option>

    </select>

    <br><br>

    <button type="submit">Add Invoice</button>

</form>


<hr>


<!-- Invoice Table -->

<h2>All Invoices</h2>

<table border="1">

    <thead>

    <tr>
        <th>ID</th>
        <th>Invoice Number</th>
        <th>Booking ID</th>
        <th>Customer</th>
        <th>Date</th>
        <th>Total Amount</th>
        <th>Paid Amount</th>
        <th>Outstanding Balance</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="invoice : ${invoices}">

        <td th:text="${invoice.invoiceId}"></td>

        <td th:text="${invoice.invoiceNumber}"></td>

        <td th:text="${invoice.booking != null ? invoice.booking.id : '-'}"></td>

        <td th:text="${invoice.customerName}"></td>

        <td th:text="${invoice.invoiceDate}"></td>

        <td th:text="${invoice.totalAmount}"></td>

        <td th:text="${paidAmounts[invoice.invoiceId]}"></td>

        <td th:text="${outstandingBalances[invoice.invoiceId]}"></td>

        <td th:text="${calculatedStatuses[invoice.invoiceId]}"></td>

        <td>

            <a th:href="@{/invoices/edit/{id}(id=${invoice.invoiceId})}">
                Edit
            </a>

            <form
                    th:action="@{/invoices/delete/{id}(id=${invoice.invoiceId})}"
                    method="post"
                    style="display:inline;">

                <button
                        type="submit"
                        onclick="return confirm('Are you sure you want to delete this invoice?')">
                    Delete
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>


<!-- Booking Integration JavaScript -->

<script>

    const bookingSelect = document.getElementById("bookingId");
    const customerNameInput = document.getElementById("customerName");
    const totalAmountInput = document.getElementById("totalAmount");

    bookingSelect.addEventListener("change", function () {

        const bookingId = this.value;

        // Nothing selected
        if (!bookingId) {
            customerNameInput.value = "";
            totalAmountInput.value = "";
            return;
        }

        fetch("/api/airline/bookings/" + bookingId)
            .then(response => {

                if (!response.ok) {
                    throw new Error("Booking could not be loaded.");
                }

                return response.json();
            })
            .then(booking => {

                customerNameInput.value = booking.customerName;
                totalAmountInput.value = booking.totalAmount;

            })
            .catch(error => {

                console.error("Error loading booking:", error);

                alert("Unable to load booking information.");

                customerNameInput.value = "";
                totalAmountInput.value = "";
            });

    });

</script>

</body>

</html>
