<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Management</title>
</head>

<body>

<h1>Payment Management</h1>

<p>Admin Operations & Billing</p>


<!-- Add Payment Form -->

<h2>Add New Payment</h2>

<form action="/payments/add" method="post">

    <label for="invoiceId">Invoice:</label>

    <select id="invoiceId" name="invoiceId" required>

        <option value="">-- Select Invoice --</option>

        <option
                th:each="invoice : ${invoices}"
                th:value="${invoice.invoiceId}"
                th:text="${invoice.invoiceNumber + ' - ' + invoice.customerName}">
        </option>

    </select>

    <br><br>


    <label for="paymentDate">Payment Date:</label>

    <input
            type="datetime-local"
            id="paymentDate"
            name="paymentDate"
            required>

    <br><br>


    <label for="amount">Amount:</label>

    <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            required>

    <br><br>


    <label for="paymentMethod">Payment Method:</label>

    <select
            id="paymentMethod"
            name="paymentMethod"
            required>

        <option value="">-- Select Method --</option>
        <option value="CASH">CASH</option>
        <option value="CARD">CARD</option>
        <option value="BANK_TRANSFER">BANK TRANSFER</option>

    </select>

    <br><br>


    <label for="paymentStatus">Payment Status:</label>

    <select
            id="paymentStatus"
            name="paymentStatus"
            required>

        <option value="COMPLETED">COMPLETED</option>
        <option value="PENDING">PENDING</option>
        <option value="FAILED">FAILED</option>

    </select>

    <br><br>


    <button type="submit">Add Payment</button>

</form>


<hr>


<!-- Payment Table -->

<h2>All Payments</h2>

<table border="1">

    <thead>

    <tr>
        <th>Payment ID</th>
        <th>Invoice</th>
        <th>Payment Date</th>
        <th>Amount</th>
        <th>Payment Method</th>
        <th>Payment Status</th>
        <th>Actions</th>
    </tr>

    </thead>


    <tbody>

    <tr th:each="payment : ${payments}">

        <td th:text="${payment.paymentId}"></td>

        <td th:text="${payment.invoice.invoiceNumber}"></td>

        <td th:text="${payment.paymentDate}"></td>

        <td th:text="${payment.amount}"></td>

        <td th:text="${payment.paymentMethod}"></td>

        <td th:text="${payment.paymentStatus}"></td>

        <td>
            <a th:href="@{/payments/edit/{id}(id=${payment.paymentId})}">
                Edit
            </a>
        </td>

    </tr>

    </tbody>

</table>

</body>

</html>
