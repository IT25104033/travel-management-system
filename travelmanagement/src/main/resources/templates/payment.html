<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Management</title>
</head>

<body>

<h1>Payment Management</h1>

<p>Admin Operations & Billing</p>


<!-- Add Payment Form -->

<h2>Add New Payment</h2>

<div th:if="${errorMessage}"
     style="color: red; margin-bottom: 15px;">

    <strong th:text="${errorMessage}"></strong>

</div>

<form action="/payments/add" method="post">

    <!-- Select Invoice -->

    <label for="invoiceId">Invoice:</label>

    <select id="invoiceId" name="invoiceId" required>

        <option value="">-- Select Invoice --</option>

        <option
                th:each="invoice : ${invoices}"
                th:value="${invoice.invoiceId}"
                th:text="${invoice.invoiceNumber + ' - ' + invoice.customerName}">
        </option>

    </select>

    <br><br>


    <!-- Invoice Billing Information -->

    <div id="invoiceBalance">

        <p>
            <strong>Invoice Total:</strong>
            <span id="invoiceTotal">-</span>
        </p>

        <p>
            <strong>Outstanding Balance:</strong>
            <span id="outstandingBalance">-</span>
        </p>

    </div>

    <br>


    <!-- Payment Date -->

    <label for="paymentDate">Payment Date:</label>

    <input
            type="datetime-local"
            id="paymentDate"
            name="paymentDate"
            required>

    <br><br>


    <!-- Payment Amount -->

    <label for="amount">Amount:</label>

    <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            required>

    <p id="amountError"
       style="color: red; display: none;">
        Payment amount cannot be greater than the outstanding balance.
    </p>

    <br><br>


    <!-- Payment Method -->

    <label for="paymentMethod">Payment Method:</label>

    <select
            id="paymentMethod"
            name="paymentMethod"
            required>

        <option value="">-- Select Method --</option>

        <option value="CASH">CASH</option>

        <option value="CARD">CARD</option>

        <option value="BANK_TRANSFER">BANK TRANSFER</option>

    </select>

    <br><br>


    <!-- Payment Status -->

    <label for="paymentStatus">Payment Status:</label>

    <select
            id="paymentStatus"
            name="paymentStatus"
            required>

        <option value="COMPLETED">COMPLETED</option>

        <option value="PENDING">PENDING</option>

        <option value="FAILED">FAILED</option>

    </select>

    <br><br>


    <button type="submit">Add Payment</button>

</form>


<hr>


<!-- Payment Table -->

<h2>All Payments</h2>

<table border="1">

    <thead>

    <tr>
        <th>Payment ID</th>
        <th>Invoice</th>
        <th>Payment Date</th>
        <th>Amount</th>
        <th>Payment Method</th>
        <th>Payment Status</th>
        <th>Actions</th>
    </tr>

    </thead>


    <tbody>

    <tr th:each="payment : ${payments}">

        <td th:text="${payment.paymentId}"></td>

        <td th:text="${payment.invoice.invoiceNumber}"></td>

        <td th:text="${payment.paymentDate}"></td>

        <td th:text="${payment.amount}"></td>

        <td th:text="${payment.paymentMethod}"></td>

        <td th:text="${payment.paymentStatus}"></td>

        <td>

            <a th:href="@{/payments/edit/{id}(id=${payment.paymentId})}">
                Edit
            </a>

            <form
                    th:action="@{/payments/delete/{id}(id=${payment.paymentId})}"
                    method="post"
                    style="display:inline;">

                <button
                        type="submit"
                        onclick="return confirm('Are you sure you want to delete this payment?')">

                    Delete

                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>


<!-- JavaScript for Invoice Billing Information -->

<script>

    document.getElementById("invoiceId").addEventListener("change", function () {

        const invoiceId = this.value;

        const invoiceTotalElement =
            document.getElementById("invoiceTotal");

        const outstandingBalanceElement =
            document.getElementById("outstandingBalance");


        // Reset values when no invoice is selected

        if (!invoiceId) {

            invoiceTotalElement.textContent = "-";

            outstandingBalanceElement.textContent = "-";

            return;
        }


        // Get invoice information

        fetch("/api/invoices/" + invoiceId)

            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not load invoice");
                }

                return response.json();

            })

            .then(invoice => {

                invoiceTotalElement.textContent =
                    invoice.totalAmount;

            })

            .catch(error => {

                console.error("Error loading invoice:", error);

                invoiceTotalElement.textContent = "Error";

            });


        // Get outstanding balance

        fetch(
            "/api/payments/invoice/"
            + invoiceId
            + "/outstanding-balance"
        )

            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not load balance");
                }

                return response.json();

            })

            .then(balance => {

                outstandingBalanceElement.textContent =
                    balance;

            })

            .catch(error => {

                console.error(
                    "Error loading outstanding balance:",
                    error
                );

                outstandingBalanceElement.textContent =
                    "Error";

            });

    });
    const paymentForm = document.querySelector("form[action='/payments/add']");
const paymentAmount = document.getElementById("amount");
const amountError = document.getElementById("amountError");

paymentForm.addEventListener("submit", function (event) {

    const outstandingText =
        document.getElementById("outstandingBalance").textContent;

    const outstandingBalance =
        parseFloat(outstandingText);

    const amount =
        parseFloat(paymentAmount.value);

    if (!isNaN(outstandingBalance)
            && !isNaN(amount)
            && amount > outstandingBalance) {

        event.preventDefault();

        amountError.style.display = "block";

        paymentAmount.focus();

        return;
    }

    amountError.style.display = "none";
});

</script>


</body>

</html>
