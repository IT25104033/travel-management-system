<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Invoice</title>
</head>

<body>

<h1>Edit Invoice</h1>

<div
        th:if="${errorMessage}"
        style="color: red; margin-bottom: 15px;">

    <strong th:text="${errorMessage}"></strong>

</div>

<form th:action="@{/invoices/update/{id}(id=${invoice.invoiceId})}"
      method="post">

    <label>Invoice Number:</label>

    <input type="text"
           name="invoiceNumber"
           th:value="${invoice.invoiceNumber}"
           required>

    <br><br>


    <label>Booking:</label>

    <select id="bookingId"
            name="bookingId"
            required>

        <option value="">
            -- Select Booking --
        </option>

        <option
                th:each="booking : ${bookings}"
                th:value="${booking.id}"
                th:text="${'Booking #' + booking.id + ' - ' + booking.customerName + ' - ' + booking.totalAmount}"
                th:selected="${invoice.booking != null and invoice.booking.id == booking.id}">
        </option>

    </select>

    <br><br>


    <label>Customer Name:</label>

    <input type="text"
           id="customerName"
           th:value="${invoice.customerName}"
           readonly>

    <br><br>


    <label>Invoice Date:</label>

    <input type="datetime-local"
           name="invoiceDate"
           th:value="${#temporals.format(invoice.invoiceDate, 'yyyy-MM-dd''T''HH:mm')}"
           required>

    <br><br>


    <label>Total Amount:</label>

    <input type="number"
           id="totalAmount"
           step="0.01"
           th:value="${invoice.totalAmount}"
           readonly>

    <br><br>


    <label>Invoice Status:</label>

    <select name="invoiceStatus" required>

        <option value="UNPAID"
                th:selected="${invoice.invoiceStatus == 'UNPAID'}">
            UNPAID
        </option>

        <option value="PARTIAL"
                th:selected="${invoice.invoiceStatus == 'PARTIAL'}">
            PARTIAL
        </option>

        <option value="PAID"
                th:selected="${invoice.invoiceStatus == 'PAID'}">
            PAID
        </option>

    </select>

    <br><br>

    <button type="submit">
        Update Invoice
    </button>

</form>

<br>

<a href="/invoices">
    Back to Invoices
</a>


<script>

    const bookingSelect = document.getElementById("bookingId");
    const customerNameInput = document.getElementById("customerName");
    const totalAmountInput = document.getElementById("totalAmount");

    bookingSelect.addEventListener("change", function () {

        const bookingId = this.value;

        if (!bookingId) {

            customerNameInput.value = "";
            totalAmountInput.value = "";

            return;
        }

        fetch("/api/airline/bookings/" + bookingId)

            .then(response => {

                if (!response.ok) {
                    throw new Error("Booking could not be loaded.");
                }

                return response.json();
            })

            .then(booking => {

                customerNameInput.value = booking.customerName;
                totalAmountInput.value = booking.totalAmount;

            })

            .catch(error => {

                console.error("Error loading booking:", error);

                alert("Unable to load booking information.");

                customerNameInput.value = "";
                totalAmountInput.value = "";

            });

    });

</script>

</body>

</html>
