<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit Tour Package | Dahamdi</title>
<link rel="stylesheet" th:href="@{/css/travel.css}">
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo"><h2>Dahamdi</h2><span>Travel Management</span></div>
<div class="nav-title">Management</div>
<ul class="nav-menu">
<li><a href="/packages" class="active"><span class="nav-icon">✈</span><span>Tour Packages</span></a></li>
<li><a href="/invoices"><span class="nav-icon">▣</span><span>Invoices</span></a></li>
</ul>
</aside>
<main class="main">
<header class="topbar"><div class="topbar-title"><h1>Edit Tour Package</h1><p>Update package information</p></div><div class="user-avatar">A</div></header>
<div class="page-content">
<div class="page-header"><div><h2>Edit Package</h2><p>Update the selected travel package.</p></div><a href="/packages" class="btn btn-light">← Back to Packages</a></div>
<div class="card">
<div class="card-header"><div><div class="card-title">Package Details</div><div class="card-subtitle">Package ID: <strong th:text="${tourPackage.packageId}">1</strong></div></div></div>
<form th:action="@{/packages/update/{id}(id=${tourPackage.packageId})}" method="post">
<div class="form-grid">
<div class="form-group"><label>Package Name</label><input type="text" name="packageName" th:value="${tourPackage.packageName}" required></div>
<div class="form-group"><label>Duration (Days)</label><input type="number" name="duration" min="1" th:value="${tourPackage.duration}" required></div>
<div class="form-group"><label>Price</label><input type="number" name="price" min="0" step="0.01" th:value="${tourPackage.price}" required></div>
    <div class="form-group">
        <label>Status</label>
        <select name="status" required>
            <option value="AVAILABLE"
                    th:selected="${tourPackage.status == 'AVAILABLE'}">
                AVAILABLE
            </option>
            <option value="UNAVAILABLE"
                    th:selected="${tourPackage.status == 'UNAVAILABLE'}">
                UNAVAILABLE
            </option>
        </select>
    </div>
<div class="form-group full"><label>Description</label><textarea name="description" required th:text="${tourPackage.description}"></textarea></div>
</div>
<div style="display:flex;gap:10px;margin-top:25px;flex-wrap:wrap">
<button type="submit" class="btn btn-primary">Save Changes</button>
<a href="/packages" class="btn btn-secondary">Cancel</a>
<a class="btn btn-success" th:href="@{/itineraries/{id}(id=${tourPackage.packageId})}">Manage Itinerary</a>
</div>
</form>
</div>
</div>
</main>
</div>
</body>
</html>
